<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | M&L Consultores</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>

<body>
    <header>
        <div class="logo">
            <img id="logo-principal" src="img/logo-empresa.jpeg" alt="M&L Consultores Financieros y Contables" role="button" tabindex="0" aria-haspopup="dialog">
            <span class="logo-nombre">M&L</span>
            <span class="logo-lema">Consultores Financieros y Contables</span>
        </div>

        <div id="visor-logo" class="visor-logo" role="dialog" aria-modal="true" aria-label="Logo ampliado">
            <button type="button" id="cerrar-logo" aria-label="Cerrar">×</button>
            <img src="img/logo-empresa.jpeg" alt="Logo ampliado de M&L">
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="Servicios.html">Servicios</a>
            <a href="Nosotros.html">Nosotros</a>
            <a href="Contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>

    <main class="pagina-contacto">
        <section class="contacto">
            <h1>Contacto</h1>

            <form class="formulario" action="https://formspree.io/f/REEMPLAZAR" method="POST">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <input type="hidden" name="_subject" value="Nuevo mensaje desde el sitio de M&L">

                <!-- Campo trampa: los humanos no lo ven, los bots si lo rellenan. -->
                <div class="hp" aria-hidden="true">
                    <label for="empresa">No completar</label>
                    <input type="text" id="empresa" name="_gotcha" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit">Enviar</button>

                <p class="form-estado" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <div>
            M&L Consultores
            <p>
                Consultores Financieros y Contables
            </p>
        </div>

        <div>
            <h2>
                Contacto:
            </h2>
            <p>Teléfono: 8888-8888 9999-9999</p>
            <p>Correo: contacto@gmail.com</p>
        </div>

        <div>
            <h2>
                Redes:
            </h2>
            <p>Facebook: Lolita</p>
            <p>Instagram: Mery</p>
        </div>

        <div>
            <h2>Copyright</h2>
            © 2026 M&L
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
